<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskFlow | Two-Tier App on AWS</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1b2236;
      --muted: #6b7690;
      --border: #e5e9f2;
      --primary: #5b6cff;
      --primary-2: #8a5bff;
      --danger: #ef4a5f;
      --ok: #22c55e;
      --shadow: 0 10px 30px rgba(31, 42, 80, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1220;
        --card: #171d33;
        --text: #eef1fb;
        --muted: #98a3c2;
        --border: #262e4a;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .hero {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      padding: 56px 20px 110px;
      text-align: center;
    }
    .hero h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.5px; }
    .hero p { margin: 0 auto; max-width: 520px; opacity: 0.9; }

    .arch {
      display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
      margin-top: 22px;
    }
    .chip {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
      backdrop-filter: blur(6px);
    }
    .arrow { opacity: 0.8; }

    .container { max-width: 640px; margin: -70px auto 40px; padding: 0 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
    .stat {
      background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    }
    .stat .n { font-size: 26px; font-weight: 800; }
    .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }

    form { display: flex; gap: 10px; }
    input[type="text"] {
      flex: 1; padding: 13px 15px; font-size: 16px; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(91, 108, 255, 0.18); }
    .btn-add {
      border: 0; cursor: pointer; padding: 0 22px; font-size: 15px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-radius: 12px; transition: transform 0.1s, opacity 0.15s;
    }
    .btn-add:hover { opacity: 0.92; }
    .btn-add:active { transform: scale(0.97); }
    .btn-add:disabled { opacity: 0.6; cursor: wait; }

    ul { list-style: none; margin: 18px 0 0; padding: 0; }
    li {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 13px 14px; margin-bottom: 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      animation: pop 0.25s ease;
      transition: opacity 0.25s, transform 0.25s;
    }
    li.removing { opacity: 0; transform: translateX(24px); }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .title { font-weight: 600; word-break: break-word; }
    .time { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .btn-del {
      flex-shrink: 0; border: 0; cursor: pointer; width: 34px; height: 34px; border-radius: 10px;
      background: transparent; color: var(--muted); font-size: 18px; line-height: 1;
      transition: background 0.15s, color 0.15s;
    }
    .btn-del:hover { background: rgba(239, 74, 95, 0.12); color: var(--danger); }

    .empty { text-align: center; color: var(--muted); padding: 28px 10px 10px; }
    .empty .emoji { font-size: 38px; display: block; margin-bottom: 6px; }
    .error {
      display: none; margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-size: 14px;
      background: rgba(239, 74, 95, 0.12); color: var(--danger); border: 1px solid rgba(239, 74, 95, 0.3);
    }

    .footer {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 18px; font-size: 13px; color: var(--muted);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
    .dot.up { background: var(--ok); box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2); }
    .dot.down { background: var(--danger); box-shadow: 0 0 0 4px rgba(239, 74, 95, 0.2); }

    @media (max-width: 480px) {
      .hero { padding-top: 40px; }
      form { flex-direction: column; }
      .btn-add { padding: 13px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>TaskFlow</h1>
    <p>A simple two-tier application running on AWS with Docker, Terraform and Jenkins.</p>
    <div class="arch">
      <span class="chip">Tier 1: Node.js + Express</span>
      <span class="arrow">&rarr;</span>
      <span class="chip">Tier 2: PostgreSQL (RDS)</span>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="stats">
        <div class="stat"><div class="n" id="count">0</div><div class="l">Total tasks</div></div>
        <div class="stat"><div class="n" id="latest">-</div><div class="l">Last added</div></div>
      </div>

      <form id="form">
        <input type="text" id="input" placeholder="What needs to be done?" maxlength="200" autocomplete="off" required />
        <button class="btn-add" id="addBtn" type="submit">Add task</button>
      </form>

      <div class="error" id="error"></div>
      <ul id="list"></ul>

      <div class="footer">
        <span class="dot" id="dot"></span>
        <span id="status">Checking server...</span>
      </div>
    </section>
  </main>

  <script>
    const list = document.getElementById('list');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const addBtn = document.getElementById('addBtn');
    const errorBox = document.getElementById('error');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = msg ? 'block' : 'none';
    }

    function timeAgo(iso) {
      const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + ' min ago';
      if (s < 86400) return Math.floor(s / 3600) + ' h ago';
      return Math.floor(s / 86400) + ' d ago';
    }

    function render(tasks) {
      document.getElementById('count').textContent = tasks.length;
      document.getElementById('latest').textContent = tasks.length ? timeAgo(tasks[0].created_at) : '-';
      list.innerHTML = '';

      if (!tasks.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = '<span class="emoji">&#128221;</span>No tasks yet. Add your first one above.';
        list.appendChild(empty);
        return;
      }

      tasks.forEach((t) => {
        const li = document.createElement('li');

        const left = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = t.title;          // textContent prevents HTML injection
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = 'Added ' + timeAgo(t.created_at);
        left.appendChild(title);
        left.appendChild(time);

        const del = document.createElement('button');
        del.className = 'btn-del';
        del.title = 'Delete task';
        del.setAttribute('aria-label', 'Delete task');
        del.innerHTML = '&#10005;';
        del.onclick = async () => {
          li.classList.add('removing');
          try {
            const r = await fetch('/api/tasks/' + t.id, { method: 'DELETE' });
            if (!r.ok) throw new Error('Delete failed');
            setTimeout(load, 220);
          } catch (e) {
            li.classList.remove('removing');
            showError('Could not delete the task. Please try again.');
          }
        };

        li.appendChild(left);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    async function load() {
      try {
        const r = await fetch('/api/tasks');
        if (!r.ok) throw new Error('Server error');
        render(await r.json());
        showError('');
      } catch (e) {
        showError('Could not load tasks. The database may still be starting.');
      }
    }

    async function checkHealth() {
      const dot = document.getElementById('dot');
      const status = document.getElementById('status');
      try {
        const r = await fetch('/health', { cache: 'no-store' });
        if (!r.ok) throw new Error();
        dot.className = 'dot up';
        status.textContent = 'Server online';
      } catch (e) {
        dot.className = 'dot down';
        status.textContent = 'Server unreachable';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      addBtn.disabled = true;
      try {
        const r = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        if (!r.ok) throw new Error('Add failed');
        input.value = '';
        showError('');
        await load();
      } catch (err) {
        showError('Could not add the task. Please try again.');
      } finally {
        addBtn.disabled = false;
        input.focus();
      }
    });

    load();
    checkHealth();
    setInterval(checkHealth, 15000);
  </script>
</body>
</html>
